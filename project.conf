# ─────────────────────────────────────────────────────────────────────────────
# project.conf — single source of truth for this Terraform project
#
# Edit this file, then run ./scripts/configure.sh to regenerate the per-env
# backend/tfvars files. Everything (scripts, Terraform, CI) flows from here, so
# cloning this repo for a different owner/region is a one-file change.
#
# This is a plain bash file (sourced by the scripts in ./scripts). Keep values
# quoted; no spaces around '='.
# ─────────────────────────────────────────────────────────────────────────────

# ── Identity ────────────────────────────────────────────────────────────────
# PREFIX distinguishes every resource/bucket name and identifies the owner.
PREFIX="ntombela-sva"
AWS_REGION="af-south-1"

# RSRC is the resource-type token in names: ${PREFIX}-${RSRC}-${env} (e.g. eks).
RSRC="eks"

# Tagging identity (applied to every resource via default_tags).
OWNER="Geeks4Learning"
APP_NAME="capitec-terraform-training"

# GitHub repo that CI runs from — used by the OIDC trust bootstrap.
GITHUB_ORG="Geeks4LearningJHB"
GITHUB_REPO="Terraform-Project-Cap"

# ── Platform ────────────────────────────────────────────────────────────────
EKS_VERSION="1.37"

# Subnets in the default VPC that EKS attaches to (HCL list literal).
# One public /24 per AZ in af-south-1 (vpc-0be33c9ef19e5520a): 1a/1b/1c.
# NOTE: these are learner-shared /24s in the default VPC and can be deleted by
# others; re-check they exist (aws ec2 describe-subnets) before a fresh apply.
SUBNET_CIDRS='["172.31.116.0/24", "172.31.117.0/24", "172.31.118.0/24"]'

# ── Environments ────────────────────────────────────────────────────────────
ENVIRONMENTS=(dev qa prod)

# Per-env node sizing, pipe-separated:
#   "<instance_types HCL list>|<capacity_type>|<min>|<max>|<desired>"
# Training: identical sizing in every env; SPOT everywhere to minimise cost.
ENV_dev='["t3.small"]|SPOT|1|2|1'
ENV_qa='["t3.small"]|SPOT|1|2|1'
ENV_prod='["t3.small"]|SPOT|1|2|1'
