name: Terraform CI/CD

# Trigger on PR for plan, manual dispatch for apply/destroy
on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to target"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.16.4"

permissions:
  contents: read

jobs:
  # Format and validate on all changes
  fmt-validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (validation only)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # Plan for all environments on PR
  plan:
    name: Plan (${{ matrix.env }})
    if: github.event_name == 'pull_request'
    needs: fmt-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, qa, prod]
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config=envs/${{ matrix.env }}/${{ matrix.env }}.tfbackend

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_prefix: ${{ secrets.TF_VAR_PREFIX }}
          TF_VAR_app_name: ${{ secrets.TF_VAR_APP_NAME }}
          TF_VAR_owner: ${{ secrets.TF_VAR_OWNER }}
        run: |
          terraform plan \
            -var-file=envs/${{ matrix.env }}/${{ matrix.env }}.tfvars \
            -out=tfplan-${{ matrix.env }} \
            -no-color \
            -detailed-exitcode || exit_code=$?

          # Exit code 0 = no changes, 1 = error, 2 = changes present
          if [ ${exit_code} -eq 1 ]; then
            echo "Terraform plan failed"
            exit 1
          fi

          terraform show -no-color tfplan-${{ matrix.env }} > plan_output.txt

          echo "exit_code=${exit_code}" >> $GITHUB_OUTPUT

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8').slice(0, 60000);
            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            const marker = `<!-- terraform-plan-${{ matrix.env }} -->`;

            let statusEmoji = '✅';
            let statusText = 'No changes';

            if (exitCode === '2') {
              statusEmoji = '📝';
              statusText = 'Changes detected';
            } else if (exitCode === '1') {
              statusEmoji = '❌';
              statusText = 'Plan failed';
            }

            const body = `${marker}
            ### ${statusEmoji} Terraform Plan — \`${{ matrix.env }}\`

            **Status:** ${statusText}

            <details><summary>Show plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`

            </details>

            <sub>Plan generated for commit: ${context.sha}</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Manual workflow dispatch - plan or apply with approval
  manual-operation:
    name: ${{ github.event.inputs.action }} - ${{ github.event.inputs.environment }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment }}
      url: https://console.aws.amazon.com/eks/home?region=${{ secrets.AWS_REGION }}
    concurrency:
      group: terraform-${{ github.event.inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config=envs/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfbackend

      - name: Terraform ${{ github.event.inputs.action }}
        env:
          TF_VAR_prefix: ${{ secrets.TF_VAR_PREFIX }}
          TF_VAR_app_name: ${{ secrets.TF_VAR_APP_NAME }}
          TF_VAR_owner: ${{ secrets.TF_VAR_OWNER }}
        run: |
          if [ "${{ github.event.inputs.action }}" == "plan" ]; then
            terraform plan \
              -var-file=envs/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars \
              -no-color
          elif [ "${{ github.event.inputs.action }}" == "apply" ]; then
            terraform apply \
              -var-file=envs/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars \
              -auto-approve \
              -no-color
          fi

      - name: Output Summary
        if: github.event.inputs.action == 'apply'
        run: |
          echo "### ✅ Terraform Apply Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ secrets.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
